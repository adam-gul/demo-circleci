
jobs:
 build:
   docker:
     - image: cimg/python:3.8
   steps:
     - checkout
     - run: echo "🔧 Building the application..."

 test:
   docker:
     - image: cimg/python:3.8
   steps:
     - run: echo "🧪 Running tests..."

 deploy:
   docker:
     - image: cimg/python:3.8
   steps:
     - run: echo "🚀 Deploying the application..."


workflows:
 version: 2
 build-test-deploy:
   jobs:
     - build
     - test:
         requires:
           - build
     - rerunFailedTests: # <<< A job that will require manual approval in the CircleCI web application.
         type: approval # This key-value pair will set your workflow to a status of "Needs Approval"
         requires: # We only run the "hold" job when test has succeeded
           - test:
              - failed
     - deploy:
         requires:
           - rerunFailedTests